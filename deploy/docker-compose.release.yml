services:
  user-auth:
    image: ${DOCKERHUB_USERNAME:?ตั้งค่า DOCKERHUB_USERNAME ก่อน}/registration-auth:${IMAGE_TAG:-latest}
    environment:
      PORT: 3000
      SERVICE_NAME: user-auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  course:
    image: ${DOCKERHUB_USERNAME:?ตั้งค่า DOCKERHUB_USERNAME ก่อน}/registration-course:${IMAGE_TAG:-latest}
    environment:
      PORT: 3000
      SERVICE_NAME: course
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  enrollment:
    image: ${DOCKERHUB_USERNAME:?ตั้งค่า DOCKERHUB_USERNAME ก่อน}/registration-enrollment:${IMAGE_TAG:-latest}
    environment:
      PORT: 3000
      SERVICE_NAME: enrollment
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  notification:
    image: ${DOCKERHUB_USERNAME:?ตั้งค่า DOCKERHUB_USERNAME ก่อน}/registration-notification:${IMAGE_TAG:-latest}
    environment:
      PORT: 3000
      SERVICE_NAME: notification
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway-web:
    image: ${DOCKERHUB_USERNAME:?ตั้งค่า DOCKERHUB_USERNAME ก่อน}/registration-gateway:${IMAGE_TAG:-latest}
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://user-auth:3000
      COURSE_SERVICE_URL: http://course:3000
      ENROLLMENT_SERVICE_URL: http://enrollment:3000
      NOTIFICATION_SERVICE_URL: http://notification:3000
    ports:
      - "8080:3000"
    depends_on:
      user-auth:
        condition: service_healthy
      course:
        condition: service_healthy
      enrollment:
        condition: service_healthy
      notification:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
