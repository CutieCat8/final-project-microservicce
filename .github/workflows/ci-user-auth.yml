name: CI - user-auth

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'services/user-auth/**'
  push:
    branches: [main]
    paths:
      - 'services/user-auth/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: ตรวจว่า Docker image สร้างได้
        run: docker build -t registration-auth:ci .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: เข้าสู่ระบบ Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build และเผยแพร่ image
        uses: docker/build-push-action@v6
        with:
          context: ./services/user-auth
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/registration-auth:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/registration-auth:${{ github.sha }}




