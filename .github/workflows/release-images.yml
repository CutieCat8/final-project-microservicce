name: Release - publish all Docker images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: gateway-web
            image: registration-gateway
          - folder: user-auth
            image: registration-auth
          - folder: course
            image: registration-course
          - folder: enrollment
            image: registration-enrollment
          - folder: notification
            image: registration-notification
    defaults:
      run:
        working-directory: services/${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - name: เข้าสู่ระบบ Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build และเผยแพร่ image ตาม version
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.folder }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest



